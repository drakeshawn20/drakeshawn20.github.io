name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A57532: ${{ secrets.A57532 }}
          BBD900: ${{ secrets.BBD900 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A57532', '')
          meta_b = os.environ.get('BBD900', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 30f4be3a2741f590ce354b190638dedb5404305c -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 9d0be7e338b62a96f89b311ac3d4e0 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
